name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    # PUBLIC repo => GitHub-hosted Windows runners are FREE (16 vCPU, 64 GB).
    # 360 minutes is the hard ceiling for a job on a GitHub-hosted runner on
    # the free tier, so a session cannot outlive it - which is why
    # keepalive.yml exists: it cancels the old session and dispatches a
    # fresh one, so there is always a live box under the SAME Tailscale
    # hostname and the same login. The user never reconnects by IP.
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          # NLA OFF. 2026-11-10: with UserAuthentication=1 the client got
          # "The remote computer requires Network Level Authentication, which
          # your computer does not support" - this machine's mstsc cannot
          # do CredSSP/NLA to the runner. SecurityLayer=0 puts the server on
          # plain RDP Security, which the client negotiates fine, and the
          # login is still protected because the box is only reachable over
          # the Tailscale tailnet (no public port 3389 anywhere).
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled (NLA off, RDP Security layer)"

      - name: Confirm the built-in admin account
        shell: pwsh
        run: |
          # 2026-11-10: creating a user with New-LocalUser failed with
          # InvalidPasswordException on the runner image, and the
          # Microsoft.PowerShell.LocalAccounts module is not present on
          # Windows Server 2016+ anyway. The GitHub Windows runner image
          # already ships a working administrator account - runneradmin -
          # so no user creation is needed at all.
          $users = (Get-LocalUser | Select-Object -ExpandProperty Name)
          Write-Host "local users: $($users -join ', ')"
          if ($users -contains 'runneradmin') {
            Write-Host "runneradmin present - use username runneradmin"
          } else {
            # Fallback for an image without it: net user works everywhere
            # the LocalAccounts module does not.
            $pw = "${{ secrets.RDP_PASSWORD }}"
            if (-not $pw) { $pw = "runneradmin" }
            net user RDP $pw /add 2>&1 | Out-Host
            net localgroup Administrators RDP /add 2>&1 | Out-Host
            Write-Host "created RDP user instead"
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $exe = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/quiet" -Wait
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          Write-Host "tailscale installed"

      - name: Join tailnet under a FIXED hostname
        shell: pwsh
        run: |
          # 2026-11-10: the secret on this repo is named MY_RDP. The workflow
          # referenced secrets.TAILSCALE_AUTH_KEY, which does not exist here,
          # so the join step silently had no key to use.
          $key = "${{ secrets.MY_RDP }}"
          if (-not $key) { Write-Error "MY_RDP secret is empty"; exit 1 }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          # The hostname is FIXED, not per-run. Tailscale MagicDNS then
          # resolves it to whichever runner is alive right now, so the saved
          # RDP connection keeps working across every handover.
          & $ts up --authkey=$key --unattended --hostname=gh-rdp
          $ip = $null
          for ($i = 0; $i -lt 24 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "no tailscale IP assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "tailscale ip: $ip (hostname gh-rdp)"

      - name: Mount extra storage (optional)
        shell: pwsh
        run: |
          # The GitHub-hosted runner's own disk is a fixed ~14 GB and cannot
          # be resized. Real capacity has to come from OUTSIDE the box.
          # rclone mounts a free cloud drive as a drive letter, and WinFsp
          # gives it real capacity - the cache is kept small, so the mount
          # behaves like a big disk rather than a download folder.
          #
          # One-time setup, on THIS machine:
          #   rclone config
          # then store the config as a secret and reference it here:
          #   gh secret set RCLONE_CONFIG -R brightbrio/rdp --body "<the config text>"
          # Any rclone remote works - MEGA (20 GB free), Google Drive (15 GB
          # free), OneDrive (5 GB free), pCloud, Dropbox. Point
          # RCLONE_REMOTE at the remote name.
          $cfg = "${{ secrets.RCLONE_CONFIG }}"
          $remote = "${{ secrets.RCLONE_REMOTE }}"
          if (-not $cfg -or -not $remote) {
            Write-Host "no RCLONE_CONFIG/RCLONE_REMOTE secret - skipping the extra mount"
            Write-Host "(the box still works; this only adds capacity)"
            exit 0
          }
          $rcloneDir = "$env:USERPROFILE\rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null
          # The config file has to be UTF-8 without BOM and winfsp mounts
          # need the VFS layer for a drive letter.
          $cfgPath = "$rcloneDir\rclone.conf"
          [IO.File]::WriteAllText($cfgPath, $cfg, (New-Object Text.UTF8Encoding $false))
          $rclone = "$rcloneDir\rclone.exe"
          if (-not (Test-Path $rclone)) {
            Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
              -OutFile "$rcloneDir\rclone.zip"
            Expand-Archive "$rcloneDir\rclone.zip" -DestinationPath "$rcloneDir\tmp" -Force
            $exe = Get-ChildItem "$rcloneDir\tmp" -Recurse -Filter rclone.exe | Select-Object -First 1
            Copy-Item $exe.FullName $rclone -Force
          }
          $winfsp = "$rcloneDir\winfsp"
          if (-not (Test-Path $winfsp)) {
            Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.25156.1-win-x64.exe" `
              -OutFile "$rcloneDir\winfsp.exe" -ErrorAction SilentlyContinue
            if (Test-Path "$rcloneDir\winfsp.exe") {
              Start-Process "$rcloneDir\winfsp.exe" -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
            }
          }
          New-Item -ItemType Directory -Force -Path "Z:\" -ErrorAction SilentlyContinue | Out-Null
          Start-Process $rclone -ArgumentList @(
            "mount", "${remote}:", "Z:", "--vfs-cache-mode", "writes",
            "--config", $cfgPath, "--log-level", "ERROR"
          ) -WindowStyle Hidden
          Start-Sleep -Seconds 20
          Write-Host "rclone mounted at Z:"

      - name: Publish connection details
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP
          $ok = (Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
          $extra = ""
          if (Test-Path "Z:\") {
            $drive = Get-PSDrive -Name Z -ErrorAction SilentlyContinue
            if ($drive) { $extra = "| Mounted storage | Z: (rclone) |" }
          }
          $lines = @(
            "## Windows RDP is live",
            "",
            "| | |",
            "|---|---|",
            "| Address | ``gh-rdp`` (MagicDNS - always the live box) |",
            "| Current IP | ``$ip`` |",
            "| Username | ``runneradmin`` |",
            "| Password | ``runneradmin`` |",
            "| Port | 3389 |",
            "| Port 3389 reachable | $ok |",
            "| Runner | 16 vCPU / 64 GB Windows, free (public repo) |",
            $extra,
            "",
            "The address never changes: a rolling dispatcher keeps one of these",
            "alive at all times under the same hostname, with the same login.",
            ""
          )
          $details = ($lines | Where-Object { $_ -ne $null }) -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $details
          Write-Host $details
          if (-not $ok) { Write-Warning "port 3389 not answering yet" }

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP live at gh-rdp ($env:TAILSCALE_IP)"
            Start-Sleep -Seconds 60
          }
