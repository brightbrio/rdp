name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    # PUBLIC repo => GitHub-hosted Windows runners are FREE (16 vCPU, 64 GB).
    # 360 minutes is the hard ceiling for a job on a GitHub-hosted runner on
    # the free tier, so a session cannot outlive it - which is why
    # keepalive.yml exists: it cancels the old session and dispatches a
    # fresh one, so there is always a live box under the SAME Tailscale
    # hostname and the same password. The user never reconnects by IP.
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled"

      - name: Create RDP user
        shell: pwsh
        run: |
          # A FIXED password from the repo secret, so every session - and
          # every future session - uses the same login. GitHub only uploads
          # a job's LOGS when the job ends, and a rolling session never
          # ends, so a random password would be unreadable in practice.
          #
          # Set once with:
          #   gh secret set RDP_PASSWORD -R brightbrio/rdp --body "yourpass"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) {
            $charSet = @{
              Upper = [char[]](65..90)
              Lower = [char[]](97..122)
              Number = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
            }
            $raw = @()
            $raw += $charSet.Upper | Get-Random -Count 4
            $raw += $charSet.Lower | Get-Random -Count 4
            $raw += $charSet.Number | Get-Random -Count 4
            $raw += $charSet.Special | Get-Random -Count 4
            $password = -join ($raw | Sort-Object { Get-Random })
            Write-Host "no RDP_PASSWORD secret set - generated a random one"
          } else {
            Write-Host "using the RDP_PASSWORD secret"
          }

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "user RDP created"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $exe = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/quiet" -Wait
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          Write-Host "tailscale installed"

      - name: Join tailnet under a FIXED hostname
        shell: pwsh
        run: |
          # 2026-11-10: the secret on this repo is named MY_RDP. The workflow
          # referenced secrets.TAILSCALE_AUTH_KEY, which does not exist here,
          # so the join step silently had no key to use.
          $key = "${{ secrets.MY_RDP }}"
          if (-not $key) { Write-Error "MY_RDP secret is empty"; exit 1 }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          # The hostname is FIXED, not per-run. Tailscale MagicDNS then
          # resolves it to whichever runner is alive right now, so the saved
          # RDP connection keeps working across every handover.
          & $ts up --authkey=$key --unattended --hostname=gh-rdp
          $ip = $null
          for ($i = 0; $i -lt 24 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "no tailscale IP assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "tailscale ip: $ip (hostname gh-rdp)"

      - name: Publish connection details
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP
          $ok = (Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
          $lines = @(
            "## Windows RDP is live",
            "",
            "| | |",
            "|---|---|",
            "| Address | ``gh-rdp`` (MagicDNS - always the live box) |",
            "| Current IP | ``$ip`` |",
            "| Username | ``RDP`` |",
            "| Password | ``$env:RDP_PASSWORD`` |",
            "| Port | 3389 |",
            "| Port 3389 reachable | $ok |",
            "| Runner | 16 vCPU / 64 GB Windows, free (public repo) |",
            "",
            "The address never changes: a rolling dispatcher keeps one of these",
            "alive at all times under the same hostname, with the same password.",
            ""
          )
          $details = $lines -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $details
          Write-Host $details
          if (-not $ok) { Write-Warning "port 3389 not answering yet" }

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP live at gh-rdp ($env:TAILSCALE_IP)"
            Start-Sleep -Seconds 60
          }
