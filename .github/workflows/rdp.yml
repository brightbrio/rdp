name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    # PUBLIC repo => GitHub-hosted Windows runners are FREE (16 vCPU, 64 GB).
    # 360 minutes is the hard ceiling on the free tier, so keepalive.yml
    # rolls a fresh session before this one expires - same hostname, same
    # login, so the saved Remote Desktop connection never changes.
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          # NLA OFF. With UserAuthentication=1 the client reported "The remote
          # computer requires Network Level Authentication, which your computer
          # does not support" - this machine's mstsc cannot do CredSSP to the
          # runner. SecurityLayer=0 puts the server on plain RDP Security,
          # which the client negotiates fine (verified on the wire: the server
          # answers PROTOCOL_RDP, no NLA). The box is still safe - port 3389
          # is reachable only over the Tailscale tailnet, never publicly.
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled (NLA off, RDP Security layer)"

      - name: Create the accounts
        shell: pwsh
        run: |
          # New-LocalUser throws InvalidPasswordException on this image and
          # the Microsoft.PowerShell.LocalAccounts module does not exist on
          # Windows Server 2016+, so `net user` is used instead.
          #
          # The account list and its passwords ride in the RDP_USERS_B64
          # secret, base64 encoded so PowerShell can never mis-read a
          # password containing $, a quote or a backtick.
          $b64 = "${{ secrets.RDP_USERS_B64 }}"
          if (-not $b64) {
            Write-Host "no RDP_USERS_B64 secret - only runneradmin exists"
            exit 0
          }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64))
          foreach ($a in ($json | ConvertFrom-Json)) {
            net user "$($a.name)" /delete 2>&1 | Out-Null
            net user "$($a.name)" "$($a.password)" /add 2>&1 | Out-Host
            net localgroup "Remote Desktop Users" "$($a.name)" /add 2>&1 | Out-Host
            if ($a.admin) {
              net localgroup "Administrators" "$($a.name)" /add 2>&1 | Out-Host
              Write-Host "created $($a.name) - administrator"
            } else {
              Write-Host "created $($a.name)"
            }
          }
          # net.exe leaves a non-zero LASTEXITCODE behind whenever a delete
          # finds nothing, and PowerShell hands that straight to the step -
          # which failed the whole job even though every account had been
          # created. A clean exit here is what actually matters.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $exe = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/quiet" -Wait
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          Write-Host "tailscale installed"

      - name: Join tailnet under a FIXED hostname
        shell: pwsh
        run: |
          # 2026-11-10: the secret on this repo is named MY_RDP. The workflow
          # referenced secrets.TAILSCALE_AUTH_KEY, which does not exist here,
          # so the join step silently had no key to use.
          $key = "${{ secrets.MY_RDP }}"
          if (-not $key) { Write-Error "MY_RDP secret is empty"; exit 1 }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=$key --unattended --hostname=gh-rdp
          $ip = $null
          for ($i = 0; $i -lt 24 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "no tailscale IP assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "tailscale ip: $ip"

      - name: Mount extra storage (optional)
        shell: pwsh
        run: |
          # The runner's own disk is a fixed ~14 GB and cannot be resized, so
          # real capacity has to come from outside the box. rclone mounts a
          # free cloud drive as a drive letter with real capacity.
          #
          # One-time setup on YOUR machine:
          #   rclone config
          # then:
          #   gh secret set RCLONE_CONFIG -R brightbrio/rdp --body "<config text>"
          #   gh secret set RCLONE_REMOTE -R brightbrio/rdp --body "myremote"
          # Any rclone remote works - MEGA (20 GB free), Google Drive (15 GB),
          # OneDrive (5 GB), pCloud, Dropbox.
          $cfg = "${{ secrets.RCLONE_CONFIG }}"
          $remote = "${{ secrets.RCLONE_REMOTE }}"
          if (-not $cfg -or -not $remote) {
            Write-Host "no RCLONE_CONFIG/RCLONE_REMOTE secret - skipping the extra mount"
            exit 0
          }
          $dir = "$env:USERPROFILE\rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cfgPath = "$dir\rclone.conf"
          [IO.File]::WriteAllText($cfgPath, $cfg, (New-Object Text.UTF8Encoding $false))
          $rclone = "$dir\rclone.exe"
          if (-not (Test-Path $rclone)) {
            Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "$dir\rclone.zip"
            Expand-Archive "$dir\rclone.zip" -DestinationPath "$dir\tmp" -Force
            $exe = Get-ChildItem "$dir\tmp" -Recurse -Filter rclone.exe | Select-Object -First 1
            Copy-Item $exe.FullName $rclone -Force
          }
          if (-not (Test-Path "$dir\winfsp")) {
            Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.25156.1-win-x64.exe" -OutFile "$dir\winfsp.exe" -ErrorAction SilentlyContinue
            if (Test-Path "$dir\winfsp.exe") {
              Start-Process "$dir\winfsp.exe" -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
            }
          }
          Start-Process $rclone -ArgumentList @(
            "mount", "${remote}:", "Z:", "--vfs-cache-mode", "writes",
            "--config", $cfgPath, "--log-level", "ERROR") -WindowStyle Hidden
          Start-Sleep -Seconds 20
          Write-Host "rclone mounted at Z:"

      - name: Publish connection details
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP
          $ok = (Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
          $lines = @(
            "## Windows RDP is live", "",
            "| | |", "|---|---|",
            "| Address | ``gh-rdp`` (MagicDNS - always the live box) |",
            "| Current IP | ``$ip`` |",
            "| Username | ``runneradmin`` |",
            "| Password | ``runneradmin`` |",
            "| Port | 3389 |",
            "| Port 3389 reachable | $ok |",
            "| Runner | 16 vCPU / 64 GB Windows, free (public repo) |", "",
            "Your own accounts (BrysonAdmin, BrysonUser1-5) and their passwords",
            "are in PASSWORDS.txt on the Desktop, in the 'Free Windows RDP' folder.",
            ""
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join [Environment]::NewLine)
          Write-Host "RDP live at $ip"

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP live at gh-rdp ($env:TAILSCALE_IP)"
            Start-Sleep -Seconds 60
          }
