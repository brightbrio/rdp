name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        echo "RDP Enabled successfully!"

    - name: Install Tailscale
      run: |
        powershell -Command "Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe -OutFile tailscale-setup.exe"
        Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --unattended

    - name: Get Connection Details
      run: |
        echo "=== RDP CONNECTION INFO ==="
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        echo "Username: runneradmin"
        echo "==========================="
        
    - name: Keep Runner Alive
      run: |
        $i = 0
        while ($true) {
          Start-Sleep -Seconds 30
          $i++
        }
