name: lemo-opuscar preview (watercolor)

# Capability test only: render a ~20-second preview of the demo film
# "Follow the Rain" that ships with the lemo-opuscar library.

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Install Tailscale
        shell: pwsh
        run: |
          $exe = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/quiet" -Wait
          Remove-Item $exe -Force -ErrorAction SilentlyContinue

      - name: Join tailnet under a FIXED hostname
        shell: pwsh
        run: |
          $key = "${{ secrets.MY_RDP }}"
          if (-not $key) { Write-Error "MY_RDP secret is empty"; exit 1 }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=$key --unattended --hostname=gh-lemo
          $ip = $null
          for ($i = 0; $i -lt 24 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "no tailscale IP assigned"; exit 1 }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "tailscale ip: $ip"

      - name: Make ffmpeg visible to Git bash
        shell: pwsh
        run: |
          # chocolatey installs ffmpeg at C:\ProgramData\chocolatey\bin\ffmpeg.exe
          # pwsh can see it, but Git bash gets its own PATH and doesn't. Create a
          # shim inside Git's bin so every call to ffmpeg â€” including from bash â€”
          # resolves to choco's ffmpeg.
          $target = "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe"
          $shim   = "C:\Program Files\Git\usr\bin\ffmpeg.exe"
          if (-not (Test-Path $target)) {
            choco install ffmpeg -y --no-progress
          }
          Copy-Item $target $shim -Force
          Write-Host "ffmpeg shim installed at $shim -> $target"

      - name: Clone the lemo-opuscar library
        shell: pwsh
        run: |
          Set-Location $env:USERPROFILE
          git clone --depth 1 --branch main https://github.com/lemomo-ai/lemo-opuscar.git
          Set-Location lemo-opuscar
          Write-Host "lib at: $PWD"

      - name: Install deps (core + voice + music)
        shell: pwsh
        run: |
          $sh = "C:\Program Files\Git\bin\sh.exe"
          & $sh "$env:USERPROFILE\lemo-opuscar\plugin\skills\lemo-opuscar\scripts\setup.sh" deps voice music
          Write-Host "deps done"

      - name: Build demo (voice, subtitles, music score)
        shell: pwsh
        run: |
          $sh = "C:\Program Files\Git\bin\sh.exe"
          & $sh "$env:USERPROFILE\lemo-opuscar\styles\watercolor\demo\build.sh"

      - name: Render a ~20 second preview
        shell: pwsh
        run: |
          Set-Location "$env:USERPROFILE\lemo-opuscar\styles\watercolor\demo"
          node render.mjs part 0 20 preview.mp4
          $dest = "$env:TEMP\preview_final.mp4"
          ffmpeg -v error -y -i preview.mp4 -i out/mix.wav `
            -c:v copy -c:a aac -shortest $dest
          Get-ChildItem $dest | Select-Object Length

      - name: Upload the preview
        shell: pwsh
        run: |
          gh release create lemo-watercolor-preview `
            "$env:TEMP\preview_final.mp4" `
            --title "lemo-opuscar preview: Follow the Rain (watercolor)" `
            --notes "20s preview of the demo film." || true
